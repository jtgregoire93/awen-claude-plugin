[project]
name = "awen-mcp"
version = "0.1.0"
description = "Gated Awen review MCP server: start_review, get_next_section, submit_checkpoint"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

# Never published to PyPI: the build backend only wires the console entry
# point that `uv run awen-mcp` starts from the plugin folder.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awen_mcp"]

[project.scripts]
awen-mcp = "awen_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
