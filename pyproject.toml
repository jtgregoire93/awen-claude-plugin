[project]
name = "awen-mcp"
version = "0.3.1"
description = "Awen review MCP server for Claude: start_review, get_next_section, submit_checkpoint"
requires-python = ">=3.9"
# Standard library only. The plugin uses the hosted server; the bundled
# fallback, server/awen_mcp.py, runs on the user's python3. This file exists
# for the dev tools below.
dependencies = []

[dependency-groups]
dev = [
    # Interop test against the official MCP client (needs Python 3.10+).
    "mcp>=1.0,<2; python_version >= '3.10'",
    "pytest>=8.0",
    "pyright>=1.1",
]

[tool.pyright]
include = ["server", "tests"]
extraPaths = ["server"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
